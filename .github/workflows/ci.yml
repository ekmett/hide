# SPDX-License-Identifier: UPL-1.0 AND BSD-3-Clause
name: CI
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
      - 'tools/docs/**'
      - 'assets/examples/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Let main finish saving its build cache; superseded PR runs may stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.flag }} / GHC 9.14.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            flag: Linux_X64
          - runner: macos-15
            flag: macOS_ARM64
          - runner: windows-2025
            flag: Windows_X64
    defaults:
      run:
        shell: bash
    env:
      TEST_RESULTS: build/ci-results/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.flag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-haskell
        id: setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            build/allocation
          key: ci-v1-${{ matrix.flag }}-ghc9.14.1-${{ hashFiles('hide.cabal', 'packages/**/*.cabal', 'plugins/**/*.cabal', 'cabal.project') }}-${{ github.sha }}
          restore-keys: |
            ci-v1-${{ matrix.flag }}-ghc9.14.1-${{ hashFiles('hide.cabal', 'packages/**/*.cabal', 'plugins/**/*.cabal', 'cabal.project') }}-
            ci-v1-${{ matrix.flag }}-ghc9.14.1-
            hpc-v2-${{ matrix.flag }}-ghc9.14.1-cabal3.16-core-web-
      - name: Prepare invocation reports
        run: mkdir -p "$TEST_RESULTS"
      - name: Build optimized editor checks
        run: cabal build editor-tests --builddir=build/allocation --disable-coverage -O1 -j2 -f-window -f-terminal
      - name: Cache completed build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            build/allocation
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check correctness and allocation once
        id: tests
        run: |
          test_exe=$(cabal list-bin editor-tests --builddir=build/allocation --disable-coverage -O1 -f-window -f-terminal)
          test_exe=${test_exe%$'\r'}
          cabal exec --builddir=build/allocation --disable-coverage -O1 -f-window -f-terminal -- "$test_exe" --xml="$TEST_RESULTS/tests.xml"
      - name: Validate test report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: python
        run: |
          import os, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path(os.environ['TEST_RESULTS']) / 'tests.xml'
          if not ET.parse(report).findall('.//testcase'):
              raise SystemExit('JUnit report contains no test cases')
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles(format('{0}/tests.xml', env.TEST_RESULTS)) != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          files: ${{ env.TEST_RESULTS }}/tests.xml
          disable_search: true
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}-ci
          fail_ci_if_error: true
      - name: Retain invocation reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.flag }}
          path: |
            ${{ env.TEST_RESULTS }}/
            build/allocation/cache/plan.json
          retention-days: 7
          if-no-files-found: error

  nixos:
    name: NixOS / installed editor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            keep-outputs = true
      - uses: nix-community/cache-nix-action@b16f249a0248efec86dd9d4224cb75f1ffa48bcc
        with:
          primary-key: nixos-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/package.nix', 'hide.cabal', 'packages/**/*.cabal', 'plugins/**/*.cabal') }}
          restore-prefixes-first-match: nixos-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - name: Build all default frontends and run the NixOS session check
        run: nix flake check --print-build-logs --max-jobs 2 --cores 2
      - name: Export the installable package and its runtime closure
        run: |
          nix build --print-build-logs
          nix copy --to "file://$PWD/nix-cache" ./result
          nix path-info ./result > nix-cache/package-path
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hide-nixos-x86_64-linux
          path: nix-cache/
          compression-level: 0
          retention-days: 7
